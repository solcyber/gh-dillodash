title = "dillodash secret scanning"

[extend]
useDefault = true

[[rules]]
id = "aws-account-id"
description = "12-digit AWS account id"
regex = '''\b\d{12}\b'''
[rules.allowlist]
regexes = ['''123456789012''']

[[rules]]
id = "onepassword-ref"
description = "1Password secret reference"
regex = '''op://[A-Za-z0-9 _-]+/'''

[[rules]]
id = "github-fine-grained-pat"
regex = '''github_pat_[A-Za-z0-9_]{22,}'''
