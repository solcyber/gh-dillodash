name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./... -count=1
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy and verify
        run: |
          go mod tidy -diff
          go mod verify
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: gitleaks over the whole history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          gitleaks git --no-banner --redact --config .gitleaks.toml .
      - name: the denylist over the tree (keyed)
        env:
          DILLODASH_HYGIENE_KEY: ${{ secrets.DILLODASH_HYGIENE_KEY }}
          DILLODASH_HYGIENE_REQUIRED: "1"
        run: go test ./internal/hygiene -count=1 -run TestNoPrivateTerms -v
      - name: the denylist over the PR's title, body and commit messages
        if: github.event_name == 'pull_request'
        env:
          DILLODASH_HYGIENE_KEY: ${{ secrets.DILLODASH_HYGIENE_KEY }}
          DILLODASH_HYGIENE_REQUIRED: "1"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          go build -o "$RUNNER_TEMP/scan" ./internal/hygiene/cmd/scan
          status=0
          printf '%s\n' "$PR_TITLE" | "$RUNNER_TEMP/scan" -name "PR title" || status=1
          printf '%s\n' "$PR_BODY" | "$RUNNER_TEMP/scan" -name "PR body" || status=1
          printf '%s\n' "$PR_HEAD_REF" | "$RUNNER_TEMP/scan" -name "PR branch" || status=1
          git log --format='%B' "$BASE..$HEAD" | "$RUNNER_TEMP/scan" -name "commit messages" || status=1
          exit $status
      - name: the denylist over the pushed commit messages
        if: github.event_name == 'push'
        env:
          DILLODASH_HYGIENE_KEY: ${{ secrets.DILLODASH_HYGIENE_KEY }}
          DILLODASH_HYGIENE_REQUIRED: "1"
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER~1..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          git log --format='%B' "$range" | go run ./internal/hygiene/cmd/scan -name "commit messages"
